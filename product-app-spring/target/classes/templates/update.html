<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link th:href="@{/style.css}" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Insert title here</title>
<style type="text/css" id="operaUserStyle"></style></head>
<body>
	<div class="container">
		<h3 class="text-warning">Update Product</h3>
		<form method="post" th:action="@{/update-product}" class="col-4" th:object="${product}">
			<div>
				<label>Product Id</label>
				<input class="form-control border-dark" th:field="*{productId}" readonly="readonly">	
			</div>
			<div>
				<label>Price</label>
				<input class="form-control border-dark" th:field="*{productPrice}">
			</div>
			<div>
				<label>Name</label>
				<input class="form-control border-dark" th:field="*{productName}">
				<span th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}" class="error">
				
			</span></div>
			<button class="btn btn-warning my-3">Update Employee</button>
			
		</form>
		
	</div>

</body>
</html>
