<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Insert title here</title>
<style type="text/css" id="operaUserStyle"></style></head>
<body>
	<div class="container">
		<h1 class="text-primary text-center">Product Management System</h1>
		<h3 class="text-primary">Product Details</h3>
		<form method="get" th:action="@{/add}">
			<button class="btn btn-primary my-3">Add New</button>
		</form>
		<form class="col-4" th:action="@{/search}">
			<div class="input-group">
				<input placeholder="Enter Product Id" class="form-control border-dark" name="searchItem">
				<button class="btn btn-primary">Search</button>
			</div>
			
		</form>
		<div th:if="${message}">
				<span style="color:red" th:text="${message}"></span>
			</div>
		
		<table class="table table-striped table-bordered table-secondary border-dark text-center">
			<thead>
				<tr>
					<th>Product Id</th>
					<th>Price</th>
					<th>Name</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.productId}"></td>
        <td th:text="${product.productPrice}"></td>
        <td th:text="${product.productName}"></td>
       <td>
            <a class="btn btn-outline-primary" th:href="@{/update (productId=${product.productId})}">Update</a>
            <a class="btn btn-outline-danger mx-3" th:href="@{/delete (productId=${product.productId})}"
            
            th:attr="onclick=|return confirm('Do you wish to delete ${product.productName}')|"
            >Delete</a>
        </td>
    </tr>
</tbody>

		</table>
	</div>                                                                                                              

</body>
</html>
